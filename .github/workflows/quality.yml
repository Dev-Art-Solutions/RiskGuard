name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-safety:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository and safety invariants
        shell: pwsh
        run: ./scripts/validate-repository.ps1
